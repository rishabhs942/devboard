<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevBoard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #38bdf8;
    }

    p {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>DevBoard</h1>
    <p>
      Organize projects, track tasks, and collaborate efficiently.
      Your developer workspace for planning, building, and shipping.
    </p>
    <a href="#" class="btn">Get Started</a>
  </div>
</body>
</html>
